<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<style>
    *{
        font-family: 'Times New Roman', Times, serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        background-color: #4b4b4b;

    }
    header{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 99;
        background-color: rebeccapurple;
    }
    .nav{
        max-width: 1200px;
        margin: auto;
        width: 100%;
        height: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .logo{
        font-size: 1.1rem;
        font-weight: 500;
        text-decoration: none;
        text-transform: uppercase;
        color:#ffff;
    }
    .box{
        color: white;
        width: 30px;
        height: 30px;
        text-align: center;
        /* background-color: blue; */
        position: relative;
    }
    .cart-count{
       position: absolute;
       top:-5px;
       right: 0;
       padding: 3px;
       height: 20px;
       width: 20px;
       line-height: 20px;
       border-radius: 50%;
       z-index: 99;
    }
    .container{
        max-width: 1200px;
        padding: 4rem;
        margin: auto;
        width: 100%;
        
    }
    h2.title{
       font-size: 1.1rem;
       font-weight: 500;
       margin-bottom: 1.5rem;
       color: #ffff;
    }
    #cart-icon{
        font-size: 1.5rem;
        cursor: pointer;
        padding-top: 10px;
    }
    img{
        width: 100%;
    }
    .shop-content{
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(220px,auto));
        gap:1.5rem;
        justify-content: center;
        align-content: center;
    }
    .food-box{
        position: relative;
        background-color: #ffff;
        padding: 10px;
        box-shadow: 0 1px 4px rgba(40,37,37,0.1);
        border-radius: 3px;
    }
    .pic{
        overflow: hidden;
    }
    .pic:hover img{
        transform: scale(1.5);
    }
    .food-img{
        transition: 0.4s;
        aspect-ratio: 1/1;
        object-fit: cover;
    }
    .food-title{
        font-size: 1rem;
        font-weight: 600;
        color: orangered;
    }
    
    .food-price{
        font-weight: 500;
    }
    .add-cart{
        position: absolute;
        bottom: 0;
        right: 0;
        background-color: green;
        color: white;
        padding: 10px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.5s;
    }
    .add-cart:hover{
        background-color: rgba(255,0,0,0.786);
    }
    .cart{
        position: fixed;
        top: 0;
        right: -100%;
        width: 400px;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px;
        background-color: white;
        box-shadow: 0 1px 4px rgba(40,37,37,0.1);
        z-index: 100;
    }
    .cart-active{
        right: 0;
        transition: 0.5s;
    }
    .cart-title{
        text-align: center;
        font-size: 1.5rem;
        font-weight: 500;
        margin-bottom: 1rem;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        padding-bottom: 20px;
    }
    .cart-box{
        display: grid;
        grid-template-columns: 32% 50% 18%;
        align-items: center;
        gap:1rem;
        margin-top: 1rem;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        padding-bottom: 10px;
    }
    .cart-img{
        width: 75px;
        height: 75px;
        object-fit: cover;
        border: 2px solid rgba(0,0,0,0.1);
        padding: 5px;
    }
    .detail-box{
        display: grid;
        row-gap:0.5rem;
    }
    .price-box{
        display: flex;
        justify-content: space-between;
    }
    .cart-food-title{
        font-size: 1rem;
        text-transform: uppercase;
        color: orangered;
        font-weight: 500;
    }
    .cart-price{
        font-weight: 500;
    }
    .cart-quantity{
        border: 1px solid rgba(0,0,0,0.1);
        outline: none;
        width: 2.4rem;
        text-align: center;
        font-size: 1rem;
    }
    .cart-remove{
        font-size: 24px;
        color: red;
        cursor: pointer;
    }
    .total{
   display: flex;
   justify-content: flex-end;
   margin-top: 1.5rem;
    }
    .total-title{
    font-size: 1rem;
    font-weight: 600;

    }
    .total-price{
        margin-left: 0.5rem;

    }
    .btn-buy{
        padding: 12px 20px;
        background-color: #2f3542;
        color: white;
        border: none;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;

    }
   #cart-close{
    position: absolute;
    top: 1rem;
    right: 0.8rem;
    font-size: 2rem;
    cursor: pointer;
   }
</style>
</head>
<body>

   <script>
  const btnCart=document.querySelector('#cart-icon');
  const cart=document.querySelector('.cart');
  const btnClose=document.querySelector('#cart-close');

  btnCart.addEventListener('click',()=>{
    cart.classList.add('cart-active');
  });

  btnClose.addEventListener('click',()=>{
    cart.classList.remove('cart-active');
  });

  document.addEventListener('DOMContentLoaded',loadFood);
  
  function loadFood(){
    loadContent();
  }

  function loadContent(){
    //remove//
    let btnRemove=document.querySelectorAll('.cart-remove');
    btnRemove.forEach((btn)=>{
        btn.addEventListener('click',removeItem);
    });
    //product item//
    let qtyElements=document.querySelectorAll('.cart-quantity');
    qtyElements.forEach((input)=>{
        input.addEventListener('change',changeQty);
    });
  

//   add-cart
  let cartBtns=document.querySelectorAll('.add-cart');
        cartBtns.forEach((btn)=>{
        btn.addEventListener('click',addCart);
    });

    updateTotal()
}
     
  function removeItem(){
        if(confirm('are your sure to remove')){
            let title=this.parentElement.querySelector('.cart-food-title').innerHTML;
            
            itemList=itemList.filter(el=>el.title=title);
            
            this.parentElement.remove();
            loadContent();
        }
       }

     function changeQty(){
        if(isNaN(this.value)|| this.value<1){
            this.value=1
        }
        loadContent();
     }
     let itemList=[];

     function addCart(){
     let food=this.parentElement;
      let title=food.querySelector('.food-title').innerHTML;
     let price=food.querySelector('.food-price').innerHTML;
     let imgSrc=food.querySelector('.food-img').src;
    //  console.log(title,price,imgSrc);

    let newProduct={title,price,imgSrc}

    //check//

    if(itemList.find((el)=>el.title==newProduct.title)){
        alert("producte already added");
        return;
    }else{
        itemList.push(newProduct);
    }

    let newProductElement=createCartProduct(title,price,imgSrc);

    let element=document.createElement('div');
    element.innerHTML=newProductElement;
    let cartBasket=document.querySelector('.cart-content');

    cartBasket.append(element);
    loadContent();
     }

     function createCartProduct(title,price,imgSrc){
        return`
         <div class="cart-box">
                         <img src="${imgSrc}" class="cart-img">
                         <div class="detail-box">
                          <div class="cart-food-title">${title}</div>
                          <div class="price-box">
                            <div class="cart-price">${price}</div>
                            <div class="cart-amt">${price}</div>
                          </div>
                          <input type="number" value="1" class="cart-quantity">
                         </div>
                         <ion-icon name="trash" class="cart-remove"></ion-icon>
                        </div> `;
     }

     function updateTotal(){
        const cartItems=document.querySelectorAll('.cart-box');
        const totlalValue=document.querySelector('.total-price');

        let total=0;

        cartItems.forEach(product=>{
            let priceElement=product.querySelector('.cart-price');
            let price=parseFloat(priceElement.innerHTML.replace("$",""));
            let qty=product.querySelector('.cart-quantity').value;total+=(price*qty);
            product.querySelector('.cart-amt').innerHTML="$"+price*qty;
        });

        totlalValue.innerHTML="$"+total;

        const cartCount=document.querySelector('.cart-count');
        let count=itemList.length;
        cartCount.innerHTML=count;

        if(count==0){
            cartCount.style.display='none';
        }else{
            cartCount.style.display='block';
        }
     }

    
   </script>
